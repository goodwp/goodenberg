name: Build examples plugin

on:
    release:
        types: [ published ]

permissions: { }

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build_and_package:
        name: Build and Package
        runs-on: ubuntu-latest
        permissions:
            contents: write  # Required to upload assets to the GitHub release
        steps:
            -   name: Checkout repository
                uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
                with:
                    # Do not store git credentials in .git -> could be leaked/exposed by infected/malicious action.
                    persist-credentials: false

            -   name: Setup Node.js
                uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
                with:
                    node-version-file: '.nvmrc'
                    package-manager-cache: false # Prevent cache poisoning.

            -   name: Install library npm dependencies
                run: npm ci

            -   name: Build library dist files
                run: npm run build

            -   name: Install all npm packages
                working-directory: examples
                run: npm ci

            -   name: Setup PHP and tools
                uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
                with:
                    php-version: 8.3
                    tools: composer:v2

            -   name: Install Composer dependencies
                run: composer install --prefer-dist --no-progress --no-cache

            -   name: Build files
                working-directory: examples
                run: npm run build

            -   name: Build plugin zip file
                working-directory: examples
                run: npm run plugin-zip

            -   name: Upload dist archive to release
                env:
                    GH_TOKEN: ${{ github.token }}
                    TAG_NAME: ${{ github.event.release.tag_name }}
                    ZIP_FILE: examples/goodenberg-examples.zip
                run: gh release upload "$TAG_NAME" "$ZIP_FILE"

