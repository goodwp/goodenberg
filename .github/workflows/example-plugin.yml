name: Build examples plugin

on:
    release:
        types: [ published ]

permissions: { }

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build_and_package:
        name: Build and Package
        runs-on: ubuntu-latest
        permissions:
            contents: write  # Required to upload assets to the GitHub release
        steps:
            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    # Do not store git credentials in .git -> could be leaked/exposed by infected/malicious action.
                    persist-credentials: false

            -   name: Setup Node.js
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version-file: '.nvmrc'
                    package-manager-cache: false # Prevent cache poisoning.

            -   name: Install library npm dependencies
                run: npm ci

            -   name: Build library dist files
                run: npm run build

            -   name: Install all npm packages
                working-directory: examples
                run: npm ci

            -   name: Setup PHP and tools
                uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
                with:
                    php-version: 8.3
                    tools: composer:v2

            -   name: Install Composer dependencies
                run: composer install --prefer-dist --no-progress --no-cache

            -   name: Build files
                working-directory: examples
                run: npm run build

            -   name: Build plugin zip file
                working-directory: examples
                run: npm run plugin-zip

            -   name: Upload dist archive to release
                env:
                    GH_TOKEN: ${{ github.token }}
                    TAG_NAME: ${{ github.event.release.tag_name }}
                    ZIP_FILE: examples/goodenberg-examples.zip
                run: gh release upload "$TAG_NAME" "$ZIP_FILE"

