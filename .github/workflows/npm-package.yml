name: Publish NPM Package (Paused)
on:
    release:
        types: [ published ]

permissions: { }

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build_and_release:
        name: Build and Release
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
                with:
                    # Do not store git credentials in .git -> could be leaked/exposed by infected/malicious action.
                    persist-credentials: false

            -   uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
                with:
                    node-version-file: ".nvmrc"
                    package-manager-cache: false # Prevent cache poisoning.

            -   name: Configure git user name and email
                run: |
                    git config user.name "GoodWP Bot"
                    git config user.email "git@goodwp.io"

            -   name: Run npm audit
                # We want to be aware of any vulnerabilities in our dependencies,
                # but we don't want to fail the build because of them.
                # So we will just log the output of npm audit.
                run: npm audit --omit=dev --omit=peer

            -   name: Install all npm packages
                run: npm ci
                # Building is automatically done by "prepare" npm script.

            -   name: Release package
                #        run: npm publish --access public
                #        env:
                #          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                run: |
                    echo "NPM publishing is disabled for now."
                    echo "TODO: add OIDC trusted deployment."
