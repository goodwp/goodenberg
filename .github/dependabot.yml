version: 2
updates:
    -   package-ecosystem: "composer"
        directory: "/"
        schedule:
            interval: "weekly"
        cooldown:
            default-days: 7
        open-pull-requests-limit: 5
        groups:
            composer-minor-patch:
                patterns:
                    - "*"
                update-types:
                    - "minor"
                    - "patch"

    -   package-ecosystem: "npm"
        directory: "/"
        schedule:
            interval: "weekly"
        cooldown:
            default-days: 7
        open-pull-requests-limit: 5
        groups:
            composer-minor-patch:
                patterns:
                    - "*"
                update-types:
                    - "minor"
                    - "patch"

    -   package-ecosystem: "github-actions"
        directory: "/"
        schedule:
            interval: "weekly"
        cooldown:
            default-days: 7
        open-pull-requests-limit: 3
        groups:
            github-actions:
                patterns:
                    - "*"
